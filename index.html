<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>¡Tu cupón de descuento!</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #374151);
      padding: 20px;
    }

    .cupon {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .emoji {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      color: #111827;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .descuento {
      font-size: 60px;
      font-weight: bold;
      color: #e11d48;
      margin: 15px 0;
    }

    .texto {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 25px;
    }

    .codigo {
      background: #f3f4f6;
      border: 2px dashed #9ca3af;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .codigo small {
      display: block;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .codigo strong {
      font-size: 24px;
      letter-spacing: 2px;
      color: #111827;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 15px;
      background: #e11d48;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #be123c;
    }

    .vencimiento {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }

    #mensaje {
      margin-top: 12px;
      color: #16a34a;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

  <div class="cupon">

    <div class="emoji">🎁</div>

    <h1>¡Tenés un descuento!</h1>

    <div class="descuento">
      20% OFF
    </div>

    <p class="texto">
      Usá este cupón en tu próxima compra.
    </p>

    <div class="codigo">
      <small>CÓDIGO DE DESCUENTO</small>
      <strong id="codigo">MELANYA</strong>
    </div>

    <button onclick="copiarCodigo()">
      COPIAR CÓDIGO
    </button>

    <div id="mensaje">
      ✓ ¡Código copiado!
    </div>

    <p class="vencimiento">
      Válido hasta el 31/10/2026
    </p>

  </div>

  <script>
    function copiarCodigo() {
      const codigo = document.getElementById("codigo").innerText;

      navigator.clipboard.writeText(codigo);

      const mensaje = document.getElementById("mensaje");
      mensaje.style.display = "block";

      setTimeout(() => {
        mensaje.style.display = "none";
      }, 2500);
    }
  </script>

</body>
</html>
